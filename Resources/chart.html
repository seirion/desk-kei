<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  html, body, #chart { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: Canvas; }
</style>
</head>
<body>
<div id="chart"></div>
<script>/*KLINECHARTS*/</script>
<script>
(function () {
  var UP = '#E63836', DOWN = '#1E87E5', FLAT = '#888888';
  var KST = 9 * 3600 * 1000;

  function post(message) { window.webkit.messageHandlers.bridge.postMessage(message); }

  var chart = klinecharts.init('chart', { timezone: 'Asia/Seoul' });
  chart.setPeriod({ type: 'minute', span: 1 });

  var scheme = window.matchMedia('(prefers-color-scheme: dark)');
  function applyStyles() {
    chart.setStyles(scheme.matches ? 'dark' : 'light');
    chart.setStyles({
      candle: {
        bar: {
          upColor: UP, downColor: DOWN, noChangeColor: FLAT,
          upBorderColor: UP, downBorderColor: DOWN, noChangeBorderColor: FLAT,
          upWickColor: UP, downWickColor: DOWN, noChangeWickColor: FLAT
        },
        tooltip: { showRule: 'none' }
      },
      indicator: {
        bars: [{ style: 'fill', borderStyle: 'solid', borderSize: 1, borderDashedValue: [2, 2],
                 upColor: UP, downColor: DOWN, noChangeColor: FLAT }]
      }
    });
  }
  applyStyles();
  scheme.addEventListener('change', applyStyles);

  // 데이터는 Swift 가 조회해서 넘겨 준다.
  var pending = {}, nextId = 0, barCallback = null, lastCumVolume = null;

  chart.setDataLoader({
    getBars: function (params) {
      var id = ++nextId;
      pending[id] = params.callback;
      post({ type: 'getBars', id: id, loadType: params.type, timestamp: params.timestamp,
             ticker: params.symbol.ticker, period: params.period });
    },
    subscribeBar: function (params) { barCallback = params.callback; },
    unsubscribeBar: function () { barCallback = null; }
  });

  function barKey(bar) {
    return bar ? bar.timestamp + ':' + bar.open + ':' + bar.high + ':' + bar.low + ':' + bar.close + ':' + bar.volume : 'none';
  }

  // 같은 봉이면 다시 보내지 않는다.
  var lastLatestKey = null, lastHoverKey = null;
  function notifyLatest() {
    var list = chart.getDataList();
    var bar = list.length ? list[list.length - 1] : null;
    var key = barKey(bar);
    if (key === lastLatestKey) return;
    lastLatestKey = key;
    post({ type: 'latest', bar: bar });
  }

  // 십자선 이벤트에는 좌표만 오는 경우가 있어, 가로 좌표로 봉을 직접 찾는다.
  function barAt(crosshair) {
    if (crosshair && crosshair.kLineData) return crosshair.kLineData;
    if (crosshair && typeof crosshair.x === 'number') {
      var points = chart.convertFromPixel([{ x: crosshair.x }], { paneId: crosshair.paneId || 'candle_pane' });
      var point = Array.isArray(points) ? points[0] : points;
      var list = chart.getDataList();
      if (point && typeof point.dataIndex === 'number' && list[point.dataIndex]) return list[point.dataIndex];
    }
    return null;
  }

  // 마우스 이동·드래그마다 이벤트가 쏟아지므로 프레임당 한 번만, 봉이 바뀔 때만 Swift 로 보낸다.
  var pendingCrosshair = null, hoverScheduled = false;
  function flushHover() {
    hoverScheduled = false;
    var bar = barAt(pendingCrosshair);
    var key = barKey(bar);
    if (key === lastHoverKey) return;
    lastHoverKey = key;
    post({ type: 'hover', bar: bar });
  }
  chart.subscribeAction('onCrosshairChange', function (crosshair) {
    pendingCrosshair = crosshair;
    if (hoverScheduled) return;
    hoverScheduled = true;
    requestAnimationFrame(flushHover);
  });

  var indicators = {};

  // 볼린저밴드의 중심선은 20 이동평균과 값이 같아 겹친다. 볼린저가 켜져 있으면
  // 20 이평선을 굵고 반투명하게 깔아 두 선이 모두 보이게 한다.
  var MA_COLORS = ['#FF9600', '#935EBD', '#1677FF', '#E11D74', '#01C5C4'];
  function syncMaStyle() {
    if (!indicators.MA) return;
    var lines = MA_COLORS.map(function (color) {
      return { style: 'solid', smooth: false, size: 1, dashedValue: [2, 2], color: color };
    });
    if (indicators.BOLL) { lines[1].size = 4; lines[1].color = 'rgba(147, 94, 189, 0.45)'; }
    chart.overrideIndicator({ name: 'MA', styles: { lines: lines } }, 'candle_pane');
  }
  var KNOWN = { MA: 'main', BOLL: 'main', VOL: 'pane', MACD: 'pane', RSI: 'pane', KDJ: 'pane' };
  function addIndicator(name, main) {
    if (main) {
      var spec = { name: name, paneId: 'candle_pane' };
      if (name === 'MA') spec.calcParams = [5, 20, 60, 120];
      chart.createIndicator(spec, true);
    } else {
      chart.createIndicator(name);
    }
    indicators[name] = true;
  }
  function removeIndicator(name) {
    chart.removeIndicator({ name: name });
    delete indicators[name];
  }
  function reportIndicators() { post({ type: 'indicators', active: Object.keys(indicators) }); }

  window.kei = {
    deliver: function (id, bars, more) {
      var callback = pending[id];
      delete pending[id];
      if (!callback) return;
      // forward 는 과거(왼쪽) 방향이다.
      callback(bars, { forward: more, backward: false });
      notifyLatest();
    },

    setSymbol: function (ticker) {
      chart.removeOverlay();
      lastCumVolume = null;
      lastLatestKey = lastHoverKey = null;
      chart.setSymbol({ ticker: ticker, pricePrecision: 0, volumePrecision: 0 });
    },

    setPeriod: function (type, span) {
      lastCumVolume = null;
      lastLatestKey = lastHoverKey = null;
      chart.setPeriod({ type: type, span: span });
    },

    // 실시간 체결로 마지막 봉을 갱신하거나 새 봉을 연다.
    tick: function (price, cumVolume, timestamp) {
      var list = chart.getDataList();
      if (!list.length || !barCallback) return;
      var period = chart.getPeriod();
      var last = list[list.length - 1];
      var bucket = last.timestamp;
      if (period.type === 'minute') {
        var ms = period.span * 60000;
        bucket = Math.floor((timestamp + KST) / ms) * ms - KST;
      } else if (period.type === 'day') {
        bucket = Math.floor((timestamp + KST) / 86400000) * 86400000 - KST;
      }
      var delta = lastCumVolume !== null && cumVolume >= lastCumVolume ? cumVolume - lastCumVolume : 0;
      lastCumVolume = cumVolume;

      var bar;
      if (bucket > last.timestamp) {
        bar = { timestamp: bucket, open: price, high: price, low: price, close: price,
                volume: period.type === 'day' ? cumVolume : delta };
      } else if (bucket === last.timestamp) {
        bar = { timestamp: last.timestamp, open: last.open,
                high: Math.max(last.high, price), low: Math.min(last.low, price), close: price,
                volume: period.type === 'day' ? cumVolume : (last.volume || 0) + delta };
      } else {
        return;
      }
      barCallback(bar);
      notifyLatest();
    },

    draw: function (name) { chart.createOverlay(name); },
    clearDrawings: function () { chart.removeOverlay(); },

    // main 이 true 면 캔들 위에 겹치고, 아니면 아래에 별도 패널로 붙인다.
    toggleIndicator: function (name, main) {
      if (indicators[name]) removeIndicator(name); else addIndicator(name, main);
      syncMaStyle();
      reportIndicators();
    },

    // 저장해 둔 지표 목록으로 맞춘다. 목록에 없는 것은 끄고, 없는 것은 목록 순서대로 켠다.
    setIndicators: function (names) {
      var wanted = {};
      names.forEach(function (n) { if (KNOWN[n]) wanted[n] = true; });
      Object.keys(indicators).forEach(function (n) { if (!wanted[n]) removeIndicator(n); });
      names.forEach(function (n) { if (KNOWN[n] && !indicators[n]) addIndicator(n, KNOWN[n] === 'main'); });
      syncMaStyle();
      reportIndicators();
    }
  };

  window.kei.toggleIndicator('MA', true);
  window.kei.toggleIndicator('VOL', false);
  post({ type: 'ready' });
})();
</script>
</body>
</html>
